<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>なんじ なんじはん ふりかえり</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7fbff;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:900px;margin:auto;padding:18px 16px 40px}h1{text-align:center;font-size:clamp(27px,7vw,46px);line-height:1.3;margin:8px 0 20px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 4px 18px #0001;margin-bottom:16px}.progress{text-align:center;color:#657784;font-weight:700;font-size:18px;margin-bottom:8px}h2{font-size:clamp(23px,5vw,34px);margin:0 0 18px;text-align:center}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}button{font:inherit;font-weight:700;border:3px solid #d8e5ee;border-radius:20px;background:#fff;padding:19px 12px;font-size:clamp(20px,4.5vw,30px);min-height:78px;cursor:pointer}button:active{transform:scale(.98);background:#eef7ff}.result{font-size:clamp(24px,5.5vw,39px);line-height:1.8;background:#fffbea;border-radius:20px;padding:22px;font-weight:700;text-align:left}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.actions button{font-size:20px;min-height:60px}.note{text-align:center;font-size:18px;color:#667;margin:18px 0 0}.hidden{display:none}@media(max-width:600px){.buttons{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body><main>
<h1>🕐 なんじ<br>なんじはん</h1>
<section id="step1" class="card"><div class="progress">① まず えらぼう</div><h2>なにを ふりかえる？</h2><div class="buttons">
<button data-type="わかった">💡 わかったこと</button><button data-type="たいせつ">⭐ たいせつなこと</button><button data-type="できた">😊 できたこと</button><button data-type="おもった">💭 おもったこと</button>
</div></section>
<section id="step2" class="card hidden"><div class="progress">② つぎを えらぼう</div><h2 id="question"></h2><div id="choices" class="buttons"></div></section>
<section id="step3" class="card hidden"><div class="progress">③ ふりかえり できあがり！</div><h2>✏️ ノートに うつそう！</h2><div id="result" class="result"></div><div class="actions"><button id="speak">🔊 よんでみる</button><button id="again">🔄 べつの ぶん</button><button id="back">↩ えらびなおす</button><button id="reset">🏠 はじめから</button></div><p class="note">この ぶんを みながら、ノートに ていねいに かこう。</p></section>
</main><script>
const data={
わかった:{q:"なにが わかった？",choices:[
["みじかい はりと ながい はり","とけいには、みじかい はりと ながい はりが あることが わかりました。"],
["みじかい はりは なんじ","みじかい はりを みて、なんじか わかることが わかりました。"],
["ながい はりは 12で ちょうど","ながい はりが 12を さしているときは、ちょうどの じかんだと わかりました。"],
["ながい はりは 6で はん","ながい はりが 6を さしているときは、なんじはんだと わかりました。"]]},
たいせつ:{q:"なにが たいせつ？",choices:[
["みじかい はりを みる","なんじかを よむときは、みじかい はりを みることが たいせつだと わかりました。"],
["ながい はりを みる","なんじかを よむときは、ながい はりも みることが たいせつだと わかりました。"],
["はりの いちを よくみる","とけいを よむときは、はりの いちを よくみることが たいせつだと わかりました。"]]},
できた:{q:"なにが できた？",choices:[
["なんじか よめた","とけいを みて、なんじか よむことが できました。"],
["なんじはんか よめた","とけいを みて、なんじはんか よむことが できました。"],
["はりを あわせた","とけいの はりを、ただしい じこくに あわせることが できました。"],
["せつめいできた","とけいの はりを みて、なんじか せつめいすることが できました。"]]},
おもった:{q:"どう おもった？",choices:[
["かんたん","とけいを よむのは、かんたんだと おもいました。"],
["むずかしい","とけいを よむのは、むずかしいと おもいました。"],
["おもしろい","いろいろな じこくの とけいを よむのが、おもしろかったです。"],
["もっと やりたい","もっと いろいろな とけいを よんでみたいです。"]]}}
let currentType="";const s1=document.getElementById('step1'),s2=document.getElementById('step2'),s3=document.getElementById('step3'),q=document.getElementById('question'),cs=document.getElementById('choices'),r=document.getElementById('result');
document.querySelectorAll('#step1 button').forEach(b=>b.onclick=()=>{currentType=b.dataset.type;q.textContent=data[currentType].q;cs.innerHTML='';data[currentType].choices.forEach(([label,text])=>{let x=document.createElement('button');x.textContent=label;x.onclick=()=>show(text);cs.appendChild(x)});s1.classList.add('hidden');s2.classList.remove('hidden');scrollTo(0,0)});
function show(text){r.textContent=text;s2.classList.add('hidden');s3.classList.remove('hidden');scrollTo(0,0)}
document.getElementById('speak').onclick=()=>{let u=new SpeechSynthesisUtterance(r.textContent);u.lang='ja-JP';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)};
document.getElementById('again').onclick=()=>{s3.classList.add('hidden');s2.classList.remove('hidden')};document.getElementById('back').onclick=()=>{s3.classList.add('hidden');s1.classList.remove('hidden')};document.getElementById('reset').onclick=()=>{s3.classList.add('hidden');s2.classList.add('hidden');s1.classList.remove('hidden')};
</script></body></html>
